<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoboard – Live (Polling)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      position: relative;
      width: 203px;
      height: 336px;
      margin: 0;
      overflow: hidden;
      background: #0a0a0c;
      color: #f2f2f4;
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      line-height: 1.2;
      -webkit-font-smoothing: antialiased;
    }

    #panel-lineup, #panel-scores, #panel-leaders {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
    }

    /* --- lineup --- */
    .lineup-card {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 0 0 0 2px;
      overflow: hidden;
    }
    .lineup-card__rows { flex: 1; min-height: 0; overflow: hidden; }
    .lineup-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      align-items: center;
      gap: 0 8px;
      padding: 3px 0;
    }
    .lineup-row__name {
      min-width: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: #F2B233;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lineup-row__pos {
      text-align: right;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .lineup-row--current {
      background: #F2B233;
      border-radius: 2px;
      padding-left: 4px;
      padding-right: 4px;
    }
    .lineup-row--current .lineup-row__name,
    .lineup-row--current .lineup-row__pos { color: #000; }
    .lineup-card__foot {
      flex-shrink: 0; padding: 2px;
      font-size: 11px; color: rgba(255, 200, 120, 0.85);
    }
    .lineup-card__foot:empty { display: none; }
    .lineup-card--idle .lineup-card__rows {
      display: flex; align-items: center; justify-content: center;
      color: #F2B233; font-weight: 700; font-size: 13px; text-align: center;
    }
    .lineup-placeholder {
      display: flex; align-items: center; justify-content: center;
      padding: 10px; text-align: center;
      color: #F2B233; font-weight: 700; font-size: 13px;
    }

    /* --- scores --- */
    .scores-wrap {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }
    .game-block {
      flex: 1;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 6px 6px 4px 2px;
    }
    .game-block + .game-block { border-top: 1px solid rgba(255,255,255,0.1); }
    .game-block__team { display: flex; align-items: center; gap: 8px; flex: 1; }
    .game-block__logo { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
    .game-block__abbr {
      flex: 1; font-size: 28px; font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .game-block__score {
      font-size: 40px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .game-block__inn {
      text-align: right;
      font-size: 22px; font-weight: 700;
      color: #ffe066;
      padding-top: 2px;
    }
    .scores-empty {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: rgba(255,255,255,0.3);
      font-size: 14px; text-align: center; padding: 16px;
    }

    /* --- leaders --- */
    .leaders-wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 2px;
    }
    .leaders-header {
      text-align: center;
      font-size: 28px; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #F2B233;
      padding: 4px 0 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .leaders-rows { flex: 1; display: flex; flex-direction: column; }
    .leader-row {
      display: grid;
      grid-template-columns: 22px 1fr 46px;
      align-items: center;
      gap: 0 6px;
      padding: 4px 4px;
      flex: 1;
      border-radius: 3px;
    }
    .leader-row--york {
      background: rgba(100, 180, 255, 0.15);
    }
    .leader-rank {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }
    .leader-info { min-width: 0; }
    .leader-name {
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 27px; font-weight: 700;
      color: #F2B233;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leader-row--york .leader-name { color: #7ecfff; }
    .leader-team {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.45);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leader-row--york .leader-team { color: rgba(126,207,255,0.7); }
    .leader-val {
      font-size: 26px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-align: right;
      letter-spacing: -0.02em;
    }

    /* --- standings --- */
    .standings-wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 2px;
    }
    .standings-header {
      text-align: center;
      font-size: 28px; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #F2B233;
      padding: 4px 0 2px;
      flex-shrink: 0;
      line-height: 1;
    }
    .standings-colheads {
      display: grid;
      grid-template-columns: 1fr 34px 34px 42px;
      gap: 0 4px;
      padding: 2px 4px 3px;
      font-size: 22px; font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em; text-transform: uppercase;
      flex-shrink: 0;
    }
    .standings-colheads span:nth-child(2),
    .standings-colheads span:nth-child(3) { text-align: center; }
    .standings-colheads span:nth-child(4) { text-align: right; }
    .standings-rows { flex: 1; display: flex; flex-direction: column; }
    .standing-row {
      display: grid;
      grid-template-columns: 1fr 34px 34px 42px;
      align-items: center;
      gap: 0 4px;
      padding: 4px 4px;
      flex: 1;
      border-radius: 3px;
    }
    .standing-row--york { background: rgba(100, 180, 255, 0.15); }
    .standing-team {
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 28px; font-weight: 700;
      color: #F2B233;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .standing-row--york .standing-team { color: #7ecfff; }
    .standing-wl {
      font-size: 26px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-align: center;
    }
    .standing-gb {
      font-size: 26px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.65);
      text-align: right;
    }
    .standing-row--york .standing-gb { color: rgba(126,207,255,0.85); }

    /* --- animate --- */
    #panel-animate {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
    }
    #animate-canvas { display: block; width: 203px; height: 336px; }
    .anim-name {
      position: absolute;
      top: 6px; left: 0; right: 0;
      text-align: center;
      font-size: 26px; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
      pointer-events: none;
    }
    .anim-dist {
      position: absolute;
      bottom: 8px; left: 0; right: 0;
      text-align: center;
      font-size: 32px; font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="panel-lineup"></div>
  <div id="panel-scores"></div>
  <div id="panel-leaders"></div>
  <div id="panel-animate">
    <canvas id="animate-canvas" width="203" height="336"></canvas>
    <div class="anim-name" id="anim-name-label"></div>
    <div class="anim-dist" id="anim-dist-label"></div>
  </div>

  <script>
    const FB_BASE     = "https://revs-2c987-default-rtdb.firebaseio.com";
    const API_BASE    = "https://api.microservices.iscoresports.com";
    const LEAGUE_ID   = "df9fb9cc-0fdb-4b79-8a3c-ad5d7b415a56";
    const SEASON_ID   = "9843025b-3dd7-4b1b-8776-a6b53a3bdb7a";
    const POLL_MS     = 5000;
    const OTS_POLL_MS = 30000;

    const TEAM_SHORT = {
      "Staten Island Ferry Hawks":    "SI",
      "York Revolution":              "YRK",
      "Long Island Ducks":            "LI",
      "Hagerstown Flying Boxcars":    "HAG",
      "Lancaster Stormers":           "LAN",
      "Lexington Legends":            "LEX",
      "Gastonia Ghost Peppers":       "GAS",
      "Southern Maryland Blue Crabs": "SMD",
      "High Point Rockers":           "HP",
      "Charleston Dirty Birds":       "CWV",
    };

    const NORTH_TEAMS = new Set([
      "Hagerstown Flying Boxcars", "York Revolution", "Lancaster Stormers",
      "Staten Island Ferry Hawks", "Long Island Ducks",
    ]);

    let state = {
      mode:       "lineup",
      gameId:     null,
      lastGameId: null,
      batterId:   null,
      lineup:     { HOME: null, AWAY: null },
      lastSide:   null
    };

    let leagueData   = new Map();
    let ootGameData  = new Map();
    let ootGameOrder = [];
    let otsInterval  = null;
    let rotateIndex    = 0;
    let rotateInterval = null;

    const lineupEl  = document.getElementById("panel-lineup");
    const scoresEl  = document.getElementById("panel-scores");
    const leadersEl = document.getElementById("panel-leaders");

    const animateEl = document.getElementById("panel-animate");

    function showPanel(name) {
      lineupEl.style.display  = name === "lineup"  ? "flex" : "none";
      scoresEl.style.display  = name === "scores"  ? "flex" : "none";
      leadersEl.style.display = (name === "leaders" || name === "standings") ? "flex" : "none";
      animateEl.style.display = name === "animate" ? "block" : "none";
    }
    showPanel("lineup");

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
      return r.json();
    }

    // --- main poll (5s) ---
    async function poll() {
      try {
        const [gameId, batterId, mode] = await Promise.all([
          fetchJson(`${FB_BASE}/iscore/gameId.json`),
          fetchJson(`${FB_BASE}/iscore/batterId.json`),
          fetchJson(`${FB_BASE}/iscore/mode.json`)
        ]);

        const prevMode  = state.mode;
        state.mode      = mode || "lineup";
        state.gameId    = gameId;
        state.batterId  = batterId;

        if (state.mode !== prevMode) {
          stopOtsPolling();
          if (state.mode === "ots-league") {
            showPanel("scores");
            startOtsPolling();
          } else if (state.mode.startsWith("leaders/")) {
            showPanel("leaders");
          } else if (state.mode === "standings") {
            showPanel("standings");
          } else if (state.mode === "animate") {
            showPanel("animate");
            startAnimate();
          } else {
            showPanel("lineup");
          }
        }

        if (state.mode === "lineup") {
          if (state.gameId && state.gameId !== state.lastGameId) {
            const raw        = await fetchJson(`${API_BASE}/api/public/games/${state.gameId}/lineup`);
            state.lineup     = { HOME: raw.HOME ?? null, AWAY: raw.AWAY ?? null };
            state.lastGameId = state.gameId;
          }
          renderLineup();
        } else if (state.mode.startsWith("leaders/") && state.mode !== prevMode) {
          const parts = state.mode.split("/");
          fetchLeaders(parts[1], parts[2]);
        } else if (state.mode === "standings" && state.mode !== prevMode) {
          fetchStandings();
        }
      } catch (e) {
        console.error("[poll error]", e);
      }
    }

    // --- lineup render ---
    function battingSlots(side) {
      const slots = state.lineup[side]?.payload?.slots ?? [];
      return slots.filter(sl => sl.player && sl.slot >= 1 && sl.slot <= 9);
    }

    function renderLineup() {
      const { batterId, lineup } = state;

      if (!lineup.HOME && !lineup.AWAY) {
        lineupEl.innerHTML = `
          <div class="lineup-card lineup-card--idle">
            <div class="lineup-card__rows">Waiting for lineup…</div>
          </div>`;
        return;
      }

      let side = state.lastSide;
      if (batterId) {
        for (const s of ["HOME", "AWAY"]) {
          const slots = lineup[s]?.payload?.slots ?? [];
          if (slots.some(sl => sl.player_id === batterId)) { side = s; break; }
        }
      }
      if (!side) side = "HOME";
      state.lastSide = side;

      const slots = battingSlots(side);
      if (!slots.length) {
        lineupEl.innerHTML = `
          <div class="lineup-card lineup-card--idle">
            <div class="lineup-card__rows">Waiting for lineup…</div>
          </div>`;
        return;
      }

      const rowsHtml = slots.map(sl => {
        const isCurrent = batterId && sl.player_id === batterId;
        const rowClass  = isCurrent ? " lineup-row--current" : "";
        const name      = sl.player?.lastName ?? "";
        const pos       = sl.position ?? "";
        return `
          <div class="lineup-row${rowClass}">
            <div class="lineup-row__name">${escapeHtml(name)}</div>
            <div class="lineup-row__pos">${escapeHtml(pos)}</div>
          </div>`;
      }).join("");

      lineupEl.innerHTML = `
        <div class="lineup-card">
          <div class="lineup-card__rows">${rowsHtml}</div>
        </div>`;
    }

    // --- OTS polling ---
    function startOtsPolling() {
      if (otsInterval) return;
      refreshOts();
      otsInterval    = setInterval(refreshOts, OTS_POLL_MS);
      rotateInterval = setInterval(() => {
        if (ootGameOrder.length > 2) {
          rotateIndex = (rotateIndex + 2) % ootGameOrder.length;
          renderScores();
        }
      }, 7500);
    }

    function stopOtsPolling() {
      if (otsInterval)    { clearInterval(otsInterval);    otsInterval    = null; }
      if (rotateInterval) { clearInterval(rotateInterval); rotateInterval = null; }
      leagueData.clear();
      ootGameData.clear();
      ootGameOrder = [];
      rotateIndex  = 0;
    }

    // live first, then scheduled, then final
    function mergeGames() {
      const all = [];
      for (const [, g] of leagueData) all.push(g);
      all.sort((a, b) => ({ 2: 0, 1: 1, 3: 2 }[a.status] ?? 3) - ({ 2: 0, 1: 1, 3: 2 }[b.status] ?? 3));
      ootGameData.clear();
      ootGameOrder = all.map(g => g.id);
      all.forEach(g => ootGameData.set(g.id, g));
      rotateIndex = 0;
      renderScores();
    }

    // --- league games ---
    async function refreshOts() {
      const now  = new Date();
      const from = new Date(now); from.setHours(0, 0, 0, 0);
      const to   = new Date(now); to.setHours(23, 59, 59, 999);
      const q = new URLSearchParams({
        leagueId:      LEAGUE_ID,
        startDateFrom: from.toISOString(),
        startDateTo:   to.toISOString(),
        take:          50,
      });

      let games;
      try {
        const json = await fetchJson(`${API_BASE}/api/public/games?${q}`);
        games = Array.isArray(json) ? json : (json?.items ?? json?.data ?? []);
      } catch (e) {
        console.warn("[ots] fetch failed:", e.message);
        return;
      }

      const others = games.filter(g => g.gameGuid !== state.gameId);
      const toFetch = others.filter(g => g.gameStatusId === 2 || g.gameStatusId === 3);
      // gameStatusId 0 or 1 = scheduled, 2 = live, 3 = final
      const results = await Promise.allSettled(
        toFetch.map(g => fetchJson(`${API_BASE}/api/games/${g.gameGuid}/latest-score/internal`))
      );
      const scoreMap = new Map();
      toFetch.forEach((g, i) => {
        if (results[i].status === "fulfilled") scoreMap.set(g.gameGuid, results[i].value);
      });

      leagueData.clear();
      const short = (apiShort, name) =>
        apiShort || TEAM_SHORT[name] || name?.slice(0, 3).toUpperCase() || "???";

      for (const g of others) {
        const id        = g.gameGuid;
        const awayShort = short(g.awayTeam?.shortName, g.awayTeam?.name);
        const homeShort = short(g.homeTeam?.shortName, g.homeTeam?.name);

        if (g.gameStatusId === 0 || g.gameStatusId === 1) {
          const raw = g.scheduledDate ?? g.startDate ?? g.scheduledAt ?? g.gameDate ?? null;
          leagueData.set(id, { id, source: "league", status: 1, awayShort, homeShort, startTime: raw ? new Date(raw) : null });
        } else {
          const score = scoreMap.get(id);
          const away  = score?.teams?.AWAY;
          const home  = score?.teams?.HOME;
          const gs    = score?.gameStatus;
          leagueData.set(id, {
            id, source: "league",
            status:    g.gameStatusId,
            awayShort: short(away?.shortName, away?.name) || awayShort,
            homeShort: short(home?.shortName, home?.name) || homeShort,
            awayRuns:  away?.runs ?? 0,
            homeRuns:  home?.runs ?? 0,
            inning:    gs?.currentInning ?? 1,
            half:      gs?.inningHalf ?? "TOP",
          });
        }
      }

      mergeGames();
    }

    // --- scores render ---
    function renderScores() {
      const pair = [0, 1].map(i => {
        if (!ootGameOrder.length) return null;
        const id = ootGameOrder[(rotateIndex + i) % ootGameOrder.length];
        return ootGameData.get(id) || null;
      });

      if (!pair.length || pair.every(g => !g)) {
        scoresEl.innerHTML = `<div class="scores-wrap"><div class="scores-empty">No games today</div></div>`;
        return;
      }
      while (pair.length < 2) pair.push(null);

      const blocks = pair.map(g => {
        if (!g) return `<div class="game-block"></div>`;

        const awayLogoSrc = `logos/${escapeHtml(g.awayShort)}.png`;
        const homeLogoSrc = `logos/${escapeHtml(g.homeShort)}.png`;

        if (g.status === 1) {
          const timeStr = g.startTime instanceof Date
            ? g.startTime.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true })
            : escapeHtml(g.startTime || "TBD");
          return `
            <div class="game-block">
              <div class="game-block__team">
                <img class="game-block__logo" src="${awayLogoSrc}" onerror="this.style.visibility='hidden'">
                <span class="game-block__abbr">${escapeHtml(g.awayShort)}</span>
              </div>
              <div class="game-block__team">
                <img class="game-block__logo" src="${homeLogoSrc}" onerror="this.style.visibility='hidden'">
                <span class="game-block__abbr">${escapeHtml(g.homeShort)}</span>
              </div>
              <div class="game-block__inn">${timeStr}</div>
            </div>`;
        }

        let inningLabel;
        if (g.status === 3) {
          inningLabel = "FINAL";
        } else if (g.source === "mlb") {
          inningLabel = "LIVE";
        } else {
          inningLabel = `${g.half === "TOP" ? "Top" : "Bot"} ${g.inning}`;
        }

        return `
          <div class="game-block">
            <div class="game-block__team">
              <img class="game-block__logo" src="${awayLogoSrc}" onerror="this.style.visibility='hidden'">
              <span class="game-block__abbr">${escapeHtml(g.awayShort)}</span>
              <span class="game-block__score">${g.awayRuns}</span>
            </div>
            <div class="game-block__team">
              <img class="game-block__logo" src="${homeLogoSrc}" onerror="this.style.visibility='hidden'">
              <span class="game-block__abbr">${escapeHtml(g.homeShort)}</span>
              <span class="game-block__score">${g.homeRuns}</span>
            </div>
            <div class="game-block__inn">${escapeHtml(inningLabel)}</div>
          </div>`;
      }).join("");

      scoresEl.innerHTML = `<div class="scores-wrap">${blocks}</div>`;
    }

    // --- leaders ---
    const STAT_CONFIG = {
      H:    { label: "HITS",    rate: false }, HR:   { label: "HR",      rate: false },
      RBI:  { label: "RBI",     rate: false }, R:    { label: "RUNS",    rate: false },
      BB:   { label: "WALKS",   rate: false }, SO:   { label: "K",       rate: false },
      SB:   { label: "SB",      rate: false }, TB:   { label: "TB",      rate: false },
      AVG:  { label: "AVG",     rate: true  }, OBP:  { label: "OBP",     rate: true  },
      SLG:  { label: "SLG",     rate: true  }, OPS:  { label: "OPS",     rate: true  },
      ERA:  { label: "ERA",     rate: true,  asc: true  },
      WHIP: { label: "WHIP",    rate: true,  asc: true  },
      W:    { label: "WINS",    rate: false }, SV:   { label: "SAVES",   rate: false },
      IP:   { label: "IP",      rate: false }, K:    { label: "K",       rate: false },
    };

    function getStatValue(item, stat) {
      const s = item.stats;
      if (!s) return null;
      const direct = s[stat];
      if (direct != null) return direct;
      return s.RATES?.[stat] ?? null;
    }

    function fmtStat(val, stat) {
      if (val == null) return "—";
      const n = typeof val === "number" ? val : parseFloat(val);
      if (!Number.isFinite(n)) return "—";
      const cfg = STAT_CONFIG[stat];
      if (!cfg?.rate) return String(Math.round(n));
      if (n < 2) {
        const s = n.toFixed(3);
        return s.startsWith("0.") ? s.slice(1) : s;
      }
      return n.toFixed(2);
    }

    async function fetchLeaders(type, stat) {
      if (!type || !stat) return;
      const endpoint  = type === "p" ? "pitching" : type === "r" ? "running" : "batting";
      const sortBy    = stat.toUpperCase();
      const cfg       = STAT_CONFIG[sortBy];
      const sortDir   = cfg?.asc ? "asc" : "desc";
      const label     = cfg?.label ?? sortBy;

      const q = new URLSearchParams({
        seasonId: SEASON_ID,
        leagueId: LEAGUE_ID,
        sortBy,
        sortDir,
        size: 5,
        page: 0,
      });

      try {
        const data  = await fetchJson(`${API_BASE}/api/api/leaderboard/player/${endpoint}?${q}`);
        const items = (data.items ?? data ?? []).slice(0, 5);
        renderLeaders(items, sortBy, label);
      } catch (e) {
        console.error("[leaders] fetch failed:", e);
        leadersEl.innerHTML = `<div class="leaders-wrap"><div class="leaders-header">Failed to load</div></div>`;
      }
    }

    function renderLeaders(items, stat, label) {
      const rows = items.map((item, i) => {
        const isYork  = item.teamName === "York Revolution";
        const abbr    = TEAM_SHORT[item.teamName] || item.teamName?.slice(0, 3).toUpperCase() || "";
        const val     = fmtStat(getStatValue(item, stat), stat);
        return `
          <div class="leader-row${isYork ? " leader-row--york" : ""}">
            <span class="leader-rank">${i + 1}</span>
            <div class="leader-info">
              <div class="leader-name">${escapeHtml((item.firstName?.[0] ? item.firstName[0] + ". " : "") + (item.lastName ?? ""))}</div>
              <div class="leader-team">${escapeHtml(abbr)}</div>
            </div>
            <span class="leader-val">${escapeHtml(val)}</span>
          </div>`;
      }).join("");

      leadersEl.innerHTML = `
        <div class="leaders-wrap">
          <div class="leaders-header">${escapeHtml(label)} Leaders</div>
          <div class="leaders-rows">${rows}</div>
        </div>`;
    }

    // --- standings ---
    function fmtGB(gb) {
      if (gb === 0) return "—";
      const whole = Math.floor(gb);
      const half  = (gb % 1) >= 0.4;
      if (whole === 0) return "½";
      return half ? `${whole}½` : String(whole);
    }

    async function fetchStandings() {
      try {
        const data = await fetchJson(`${API_BASE}/api/leagues/standings?seasonId=${SEASON_ID}`);
        renderStandings(data);
      } catch (e) {
        console.error("[standings] fetch failed:", e);
        leadersEl.innerHTML = `<div class="standings-wrap"><div class="standings-header">Failed to load</div></div>`;
      }
    }

    function renderStandings(data) {
      let teams = Array.isArray(data) ? data
        : (data?.teams ?? data?.items ?? data?.standings ?? []);

      teams = teams.filter(t => NORTH_TEAMS.has(t.teamName ?? t.name ?? ""));

      if (!teams.length) {
        leadersEl.innerHTML = `<div class="standings-wrap"><div class="standings-header">No standings data</div></div>`;
        return;
      }

      const getW = t => t.W ?? t.wins ?? t.w ?? 0;
      const getL = t => t.L ?? t.losses ?? t.l ?? 0;

      teams.sort((a, b) => {
        const wDiff = getW(b) - getW(a);
        return wDiff !== 0 ? wDiff : getL(a) - getL(b);
      });

      const leaderW = getW(teams[0]);
      const leaderL = getL(teams[0]);

      const rows = teams.map((t, i) => {
        const name   = t.teamName ?? t.name ?? "";
        const short  = TEAM_SHORT[name] || name.slice(0, 3).toUpperCase();
        const w      = getW(t);
        const l      = getL(t);
        const gb     = i === 0 ? 0 : ((leaderW - w) + (l - leaderL)) / 2;
        const isYork = name === "York Revolution";
        return `
          <div class="standing-row${isYork ? " standing-row--york" : ""}">
            <span class="standing-team">${escapeHtml(short)}</span>
            <span class="standing-wl">${w}</span>
            <span class="standing-wl">${l}</span>
            <span class="standing-gb">${fmtGB(gb)}</span>
          </div>`;
      }).join("");

      leadersEl.innerHTML = `
        <div class="standings-wrap">
          <div class="standings-header">North</div>
          <div class="standings-colheads">
            <span></span>
            <span>W</span>
            <span>L</span>
            <span>GB</span>
          </div>
          <div class="standings-rows">${rows}</div>
        </div>`;
    }

    // --- animate mode ---
    const ANIM_PARK = {
      leftFoul:326, leftCenter:(405+326)/2, center:405,
      rightCenter:(300+405)/2, rightFoul:300,
      leftFoulHeight:10, leftCenterHeight:10, centerHeight:10,
      rightCenterHeight:10, rightFoulHeight:37.8
    };
    const ANIM_SPEED = 4, ANIM_PAUSE = 900, ANIM_G = 32;

    let _T = null;
    let animReady = false;
    let animRenderer, animScene, animCamera;
    let animBall;
    let animTraceLines = [];
    let animClock = null;
    let animQueue = [], animIdx = 0;
    let animD = 0, animActualD = 0, animT = 1, animAr = 0;
    let animElapsed = 0, animStopped = true, animPauseAt = 0;
    let animLastBatter = null;

    const animDistEl = document.getElementById('anim-dist-label');
    const animNameEl = document.getElementById('anim-name-label');

    function animNewTrace() {
      const geo = new _T.BufferGeometry().setFromPoints([new _T.Vector3()]);
      const line = new _T.Line(geo, new _T.LineBasicMaterial({ color: 0x7ecfff }));
      line.frustumCulled = false; line.renderOrder = 2; line.material.depthTest = false;
      animScene.add(line);
      animTraceLines.push({ line, geo, pts: [new _T.Vector3()] });
    }

    function animClearTraces() {
      for (const t of animTraceLines) animScene.remove(t.line);
      animTraceLines = [];
    }

    function animPlayRow(row) {
      animActualD = +(row.Distance) || 350;
      animD       = animActualD + 20;
      animT       = +(row.HangTime) || 4;
      animAr      = ((+(row.Direction) || 0) * Math.PI / 180) - Math.PI / 2;
      animElapsed = 0;
      animStopped = false;
      animBall.visible = true;
      animBall.position.set(0, 1, 0);
      animDistEl.textContent = '';
      animNewTrace();
      animClock.start();
    }

    function animLoop() {
      requestAnimationFrame(animLoop);
      if (!animReady) return;

      const now = performance.now();

      if (animPauseAt > 0) {
        if (now < animPauseAt) { animRenderer.render(animScene, animCamera); return; }
        animPauseAt = 0;
        animIdx++;
        if (animIdx < animQueue.length) {
          animPlayRow(animQueue[animIdx]);
        } else {
          animBall.visible = false;
        }
      }

      if (!animStopped && animQueue.length) {
        const dt = animClock.getDelta() * ANIM_SPEED;
        animElapsed += dt;
        const u  = Math.min(animElapsed / animT, 1);
        const x  = animD * u * Math.cos(animAr);
        const z  = animD * u * Math.sin(animAr);
        const vy = ANIM_G * animT / 2;
        const y  = Math.max(vy * animElapsed - 0.5 * ANIM_G * animElapsed * animElapsed, 0);
        const pos = new _T.Vector3(x, y, z);

        if (u < 1) {
          animBall.position.copy(pos);
          const cur = animTraceLines[animTraceLines.length - 1];
          if (cur) { cur.pts.push(pos.clone()); cur.geo.setFromPoints(cur.pts); }
          animDistEl.textContent = Math.round(animActualD * u) + ` ft (${animIdx + 1})`;
        } else {
          animDistEl.textContent = Math.round(animActualD) + ` ft (${animIdx + 1})`;
          animStopped = true;
          animPauseAt = now + ANIM_PAUSE;
        }
      }

      animRenderer.render(animScene, animCamera);
    }

    async function initAnimScene() {
      if (animReady) return;

      const loadSrc = src => new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
      if (!window.THREE) await loadSrc('https://unpkg.com/three@0.160.0/build/three.min.js');
      if (!window.Papa)  await loadSrc('https://unpkg.com/papaparse@5.3.2/papaparse.min.js');
      _T = window.THREE;

      const canvas = document.getElementById('animate-canvas');
      animRenderer = new _T.WebGLRenderer({ canvas, antialias: true });
      animRenderer.setSize(203, 336);
      animScene = new _T.Scene();
      animScene.background = new _T.Color(0x87CEEB);
      animCamera = new _T.PerspectiveCamera(68, 203/336, 0.1, 2000);
      animCamera.position.set(0, 420, 80);
      animCamera.lookAt(0, 0, -180);
      animScene.add(new _T.AmbientLight(0x999999));
      const dl = new _T.DirectionalLight(0xffffff, 1.2);
      dl.position.set(-200, 300, 100);
      animScene.add(dl);

      // field group
      const fg = new _T.Group(); fg.rotation.y = Math.PI; animScene.add(fg);
      const cfg = ANIM_PARK;
      const dR = d => d * Math.PI / 180;
      const rawA = [
        { ang:-45,   d:cfg.leftFoul,    h:cfg.leftFoulHeight },
        { ang:-22.5, d:cfg.leftCenter,  h:cfg.leftCenterHeight },
        { ang:0,     d:cfg.center,      h:cfg.centerHeight },
        { ang:22.5,  d:cfg.rightCenter, h:cfg.rightCenterHeight },
        { ang:45,    d:cfg.rightFoul,   h:cfg.rightFoulHeight }
      ];
      const anch = rawA.map(p => {
        const t = dR(p.ang - 90);
        return { pos: new _T.Vector3(p.d*Math.cos(t), 0, -p.d*Math.sin(t)), h: p.h };
      });

      // turf
      const ts = new _T.Shape(); ts.moveTo(0, 0);
      anch.forEach(a => ts.lineTo(a.pos.x, -a.pos.z)); ts.closePath();
      const tg = new _T.ShapeGeometry(ts); tg.rotateX(-Math.PI/2);
      fg.add(new _T.Mesh(tg, new _T.MeshLambertMaterial({ color:0x33aa33, side:_T.DoubleSide })));

      // infield dirt (arc center offset toward CF for proper baseball D shape)
      const BASE=90, EXT=55, R=BASE+EXT;
      const Rh = R/Math.SQRT2, Bh = BASE/Math.SQRT2;
      const CY = BASE;
      const dyR = Rh - CY;
      const r2  = Math.hypot(Rh, dyR);
      const a1  = Math.atan2(-dyR,  Rh);
      const a2  = Math.atan2(-dyR, -Rh);
      const ds = new _T.Shape(); ds.moveTo(0,0);
      ds.lineTo(Bh,-Bh);
      ds.lineTo(Rh,-Rh);
      ds.absarc(0,-CY,r2,a1,a2,true);
      ds.lineTo(-Bh,-Bh); ds.lineTo(0,0);
      const dg = new _T.ShapeGeometry(ds); dg.rotateX(-Math.PI/2);
      const dm = new _T.Mesh(dg, new _T.MeshLambertMaterial({ color:0x6B3A1F }));
      dm.renderOrder=1; dm.material.depthTest=false; fg.add(dm);

      // outfield walls + collision boxes
      for (let i = 0; i < 4; i++) {
        const A = anch[i], B = anch[i+1];
        const dir  = B.pos.clone().sub(A.pos).normalize();
        const perp = new _T.Vector3(-dir.z, 0, dir.x);
        const p = [
          A.pos.clone().add(perp.clone().multiplyScalar(0.5)),
          A.pos.clone().add(perp.clone().multiplyScalar(-0.5)),
          B.pos.clone().add(perp.clone().multiplyScalar(-0.5)),
          B.pos.clone().add(perp.clone().multiplyScalar(0.5))
        ];
        const h = (A.h + B.h) / 2;
        const top = p.map(v => v.clone().setY(h));
        const verts = [...p, ...top].flatMap(v => [v.x, v.y, v.z]);
        const idx = [0,1,2,2,3,0, 4,7,6,6,5,4, 0,4,5,5,1,0, 1,5,6,6,2,1, 2,6,7,7,3,2, 3,7,4,4,0,3];
        const geo = new _T.BufferGeometry();
        geo.setAttribute('position', new _T.Float32BufferAttribute(verts, 3));
        geo.setIndex(idx); geo.computeVertexNormals();
        const wall = new _T.Mesh(geo, new _T.MeshLambertMaterial({ color:0xff7f00 }));
        fg.add(wall);
      }

      // ball
      animBall = new _T.Mesh(
        new _T.SphereGeometry(3, 16, 16),
        new _T.MeshStandardMaterial({ color:0xffffff })
      );
      animBall.frustumCulled=false; animBall.renderOrder=2; animBall.material.depthTest=false;
      animScene.add(animBall);

      // foul lines
      const flMat = new _T.LineBasicMaterial({ color: 0xffffff });
      [anch[0], anch[4]].forEach(a => {
        const g = new _T.BufferGeometry().setFromPoints([
          new _T.Vector3(0, 0.5, 0), a.pos.clone().setY(0.5)
        ]);
        const fl = new _T.Line(g, flMat);
        fl.renderOrder = 3; fl.material.depthTest = false; fg.add(fl);
      });

      // infield grass diamond (inside the base paths)
      const bsq = BASE / Math.SQRT2;
      const igs = new _T.Shape();
      igs.moveTo(0, 0);
      igs.lineTo(bsq, -bsq);
      igs.lineTo(0, -BASE * Math.SQRT2);
      igs.lineTo(-bsq, -bsq);
      igs.closePath();
      const igg = new _T.ShapeGeometry(igs); igg.rotateX(-Math.PI / 2);
      const igm = new _T.Mesh(igg, new _T.MeshLambertMaterial({ color: 0x2d8a2d }));
      igm.renderOrder = 2; igm.material.depthTest = false; fg.add(igm);

      // bases
      const baseMat = new _T.MeshLambertMaterial({ color: 0xffffff });
      const baseGeo = new _T.BoxGeometry(5, 0.8, 5);
      [
        [bsq, 0.4, bsq], [0, 0.4, BASE * Math.SQRT2], [-bsq, 0.4, bsq]
      ].forEach(([x, y, z]) => {
        const m = new _T.Mesh(baseGeo, baseMat); m.position.set(x, y, z); fg.add(m);
      });

      // pitcher's mound
      const mound = new _T.Mesh(
        new _T.CylinderGeometry(9, 10, 1.5, 16),
        new _T.MeshLambertMaterial({ color: 0x5C3011 })
      );
      mound.position.set(0, 0.75, 60.5); fg.add(mound);

      animClock = new _T.Clock();
      animReady = true;
      requestAnimationFrame(animLoop);
    }

    function loadAnimHRs(name) {
      animClearTraces();
      const nameParts = name.trim().toLowerCase().split(/[\s,]+/).filter(p => p.length > 2);
      Papa.parse('../data.csv', {
        download: true, header: true, dynamicTyping: true,
        complete(res) {
          const hrs = res.data.filter(r => {
            if (r.PlayResult !== 'HomeRun' || !(r.Distance > 0) || !(r.HangTime > 0)) return false;
            const csvParts = String(r.Batter || '').toLowerCase().split(/[\s,]+/).filter(p => p.length > 2);
            return nameParts.every(np => csvParts.includes(np));
          });
          if (!hrs.length) { animDistEl.textContent = 'No HRs'; return; }
          animQueue = hrs; animIdx = 0;
          animPlayRow(animQueue[0]);
        }
      });
    }

    async function startAnimate() {
      await initAnimScene();
      try {
        const [playerOverride, batter] = await Promise.all([
          fetchJson(`${FB_BASE}/iscore/player.json`).catch(() => null),
          fetchJson(`${FB_BASE}/scoreboard/score_batter.json`).catch(() => null),
        ]);
        const name = (typeof playerOverride === 'string' ? playerOverride : null) || batter?.name || '';
        if (typeof name !== 'string' || !name) return;
        animNameEl.textContent = name;
        if (name !== animLastBatter || !animQueue.length) {
          animLastBatter = name;
          loadAnimHRs(name);
        }
      } catch(e) {
        console.warn('[animate]', e.message);
      }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
