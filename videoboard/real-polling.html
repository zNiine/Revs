<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoboard – Live (Polling)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      position: relative;
      width: 203px;
      height: 336px;
      margin: 0;
      overflow: hidden;
      background: #0a0a0c;
      color: #f2f2f4;
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      line-height: 1.2;
      -webkit-font-smoothing: antialiased;
    }

    #panel-lineup, #panel-scores, #panel-leaders {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
    }

    /* --- lineup --- */
    .lineup-card {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 0 0 0 2px;
      overflow: hidden;
    }
    .lineup-card__rows { flex: 1; min-height: 0; overflow: hidden; }
    .lineup-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      align-items: center;
      gap: 0 8px;
      padding: 3px 0;
    }
    .lineup-row__name {
      min-width: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: #F2B233;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lineup-row__pos {
      text-align: right;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .lineup-row--current {
      background: #F2B233;
      border-radius: 2px;
      padding-left: 4px;
      padding-right: 4px;
    }
    .lineup-row--current .lineup-row__name,
    .lineup-row--current .lineup-row__pos { color: #000; }
    .lineup-card__foot {
      flex-shrink: 0; padding: 2px;
      font-size: 11px; color: rgba(255, 200, 120, 0.85);
    }
    .lineup-card__foot:empty { display: none; }
    .lineup-card--idle .lineup-card__rows {
      display: flex; align-items: center; justify-content: center;
      color: #F2B233; font-weight: 700; font-size: 13px; text-align: center;
    }
    .lineup-placeholder {
      display: flex; align-items: center; justify-content: center;
      padding: 10px; text-align: center;
      color: #F2B233; font-weight: 700; font-size: 13px;
    }

    /* --- scores --- */
    .scores-wrap {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }
    .game-block {
      flex: 1;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 6px 6px 4px 2px;
    }
    .game-block + .game-block { border-top: 1px solid rgba(255,255,255,0.1); }
    .game-block__team { display: flex; align-items: center; gap: 8px; flex: 1; }
    .game-block__logo { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
    .game-block__abbr {
      flex: 1; font-size: 28px; font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .game-block__score {
      font-size: 40px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .game-block__inn {
      text-align: right;
      font-size: 22px; font-weight: 700;
      color: #ffe066;
      padding-top: 2px;
    }
    .scores-empty {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: rgba(255,255,255,0.3);
      font-size: 14px; text-align: center; padding: 16px;
    }

    /* --- leaders --- */
    .leaders-wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 2px;
    }
    .leaders-header {
      text-align: center;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #F2B233;
      padding: 4px 0 6px;
      flex-shrink: 0;
    }
    .leaders-rows { flex: 1; display: flex; flex-direction: column; }
    .leader-row {
      display: grid;
      grid-template-columns: 22px 1fr 46px;
      align-items: center;
      gap: 0 6px;
      padding: 4px 4px;
      flex: 1;
      border-radius: 3px;
    }
    .leader-row--york {
      background: rgba(100, 180, 255, 0.15);
    }
    .leader-rank {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }
    .leader-info { min-width: 0; }
    .leader-name {
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 23px; font-weight: 700;
      color: #F2B233;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leader-row--york .leader-name { color: #7ecfff; }
    .leader-team {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.45);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leader-row--york .leader-team { color: rgba(126,207,255,0.7); }
    .leader-val {
      font-size: 26px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-align: right;
      letter-spacing: -0.02em;
    }

    /* --- standings --- */
    .standings-wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 2px;
    }
    .standings-header {
      text-align: center;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #F2B233;
      padding: 4px 0 2px;
      flex-shrink: 0;
    }
    .standings-colheads {
      display: grid;
      grid-template-columns: 1fr 30px 30px 38px;
      gap: 0 4px;
      padding: 0 4px 3px;
      font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em; text-transform: uppercase;
      flex-shrink: 0;
    }
    .standings-colheads span:nth-child(2),
    .standings-colheads span:nth-child(3) { text-align: center; }
    .standings-colheads span:nth-child(4) { text-align: right; }
    .standings-rows { flex: 1; display: flex; flex-direction: column; }
    .standing-row {
      display: grid;
      grid-template-columns: 1fr 30px 30px 38px;
      align-items: center;
      gap: 0 4px;
      padding: 4px 4px;
      flex: 1;
      border-radius: 3px;
    }
    .standing-row--york { background: rgba(100, 180, 255, 0.15); }
    .standing-team {
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 26px; font-weight: 700;
      color: #F2B233;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .standing-row--york .standing-team { color: #7ecfff; }
    .standing-wl {
      font-size: 19px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-align: center;
    }
    .standing-gb {
      font-size: 19px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.65);
      text-align: right;
    }
    .standing-row--york .standing-gb { color: rgba(126,207,255,0.85); }
  </style>
</head>
<body>
  <div id="panel-lineup"></div>
  <div id="panel-scores"></div>
  <div id="panel-leaders"></div>

  <script>
    const FB_BASE     = "https://revs-2c987-default-rtdb.firebaseio.com";
    const API_BASE    = "https://api.microservices.iscoresports.com";
    const LEAGUE_ID   = "df9fb9cc-0fdb-4b79-8a3c-ad5d7b415a56";
    const SEASON_ID   = "9843025b-3dd7-4b1b-8776-a6b53a3bdb7a";
    const POLL_MS     = 5000;
    const OTS_POLL_MS = 30000;

    const TEAM_SHORT = {
      "Staten Island Ferry Hawks":    "SI",
      "York Revolution":              "YRK",
      "Long Island Ducks":            "LI",
      "Hagerstown Flying Boxcars":    "HAG",
      "Lancaster Stormers":           "LAN",
      "Lexington Legends":            "LEX",
      "Gastonia Ghost Peppers":       "GAS",
      "Southern Maryland Blue Crabs": "SMD",
      "High Point Rockers":           "HP",
      "Charleston Dirty Birds":       "CWV",
    };

    const NORTH_TEAMS = new Set([
      "Hagerstown Flying Boxcars", "York Revolution", "Lancaster Stormers",
      "Staten Island Ferry Hawks", "Long Island Ducks",
    ]);

    const MLB_ABBR = {
      "Baltimore Orioles":      "BAL",  "Philadelphia Phillies":  "PHI",
      "Pittsburgh Pirates":     "PIT",  "Washington Nationals":   "WSH",
      "Boston Red Sox":         "BOS",  "New York Yankees":       "NYY",
      "Cincinnati Reds":        "CIN",  "Los Angeles Dodgers":    "LAD",
      "New York Mets":          "NYM",  "Atlanta Braves":         "ATL",
      "Miami Marlins":          "MIA",  "Toronto Blue Jays":      "TOR",
      "Tampa Bay Rays":         "TB",   "Chicago White Sox":      "CWS",
      "Chicago Cubs":           "CHC",  "Cleveland Guardians":    "CLE",
      "Detroit Tigers":         "DET",  "Kansas City Royals":     "KC",
      "Minnesota Twins":        "MIN",  "Houston Astros":         "HOU",
      "Los Angeles Angels":     "LAA",  "Oakland Athletics":      "OAK",
      "Seattle Mariners":       "SEA",  "Texas Rangers":          "TEX",
      "Arizona Diamondbacks":   "ARI",  "Colorado Rockies":       "COL",
      "San Diego Padres":       "SD",   "San Francisco Giants":   "SF",
      "St. Louis Cardinals":    "STL",  "Milwaukee Brewers":      "MIL",
    };

    let state = {
      mode:       "lineup",
      gameId:     null,
      lastGameId: null,
      batterId:   null,
      lineup:     { HOME: null, AWAY: null },
      lastSide:   null
    };

    let leagueData   = new Map();
    let mlbData      = new Map();
    let ootGameData  = new Map();
    let ootGameOrder = [];
    let otsInterval  = null;
    let mlbInterval  = null;
    let rotateIndex    = 0;
    let rotateInterval = null;

    const lineupEl  = document.getElementById("panel-lineup");
    const scoresEl  = document.getElementById("panel-scores");
    const leadersEl = document.getElementById("panel-leaders");

    function showPanel(name) {
      lineupEl.style.display  = name === "lineup"  ? "flex" : "none";
      scoresEl.style.display  = name === "scores"  ? "flex" : "none";
      leadersEl.style.display = (name === "leaders" || name === "standings") ? "flex" : "none";
    }
    showPanel("lineup");

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
      return r.json();
    }

    // --- main poll (5s) ---
    async function poll() {
      try {
        const [gameId, batterId, mode] = await Promise.all([
          fetchJson(`${FB_BASE}/iscore/gameId.json`),
          fetchJson(`${FB_BASE}/iscore/batterId.json`),
          fetchJson(`${FB_BASE}/iscore/mode.json`)
        ]);

        const prevMode  = state.mode;
        state.mode      = mode || "lineup";
        state.gameId    = gameId;
        state.batterId  = batterId;

        if (state.mode !== prevMode) {
          stopOtsPolling();
          if (state.mode === "ots-league") {
            showPanel("scores");
            startOtsPolling();
          } else if (state.mode.startsWith("leaders/")) {
            showPanel("leaders");
          } else if (state.mode === "standings") {
            showPanel("standings");
          } else {
            showPanel("lineup");
          }
        }

        if (state.mode === "lineup") {
          if (state.gameId && state.gameId !== state.lastGameId) {
            const raw        = await fetchJson(`${API_BASE}/api/public/games/${state.gameId}/lineup`);
            state.lineup     = { HOME: raw.HOME ?? null, AWAY: raw.AWAY ?? null };
            state.lastGameId = state.gameId;
          }
          renderLineup();
        } else if (state.mode.startsWith("leaders/") && state.mode !== prevMode) {
          const parts = state.mode.split("/");
          fetchLeaders(parts[1], parts[2]);
        } else if (state.mode === "standings" && state.mode !== prevMode) {
          fetchStandings();
        }
      } catch (e) {
        console.error("[poll error]", e);
      }
    }

    // --- lineup render ---
    function battingSlots(side) {
      const slots = state.lineup[side]?.payload?.slots ?? [];
      return slots.filter(sl => sl.player && sl.slot >= 1 && sl.slot <= 9);
    }

    function renderLineup() {
      const { batterId, lineup } = state;

      if (!lineup.HOME && !lineup.AWAY) {
        lineupEl.innerHTML = `
          <div class="lineup-card lineup-card--idle">
            <div class="lineup-card__rows">Waiting for lineup…</div>
          </div>`;
        return;
      }

      let side = state.lastSide;
      if (batterId) {
        for (const s of ["HOME", "AWAY"]) {
          const slots = lineup[s]?.payload?.slots ?? [];
          if (slots.some(sl => sl.player_id === batterId)) { side = s; break; }
        }
      }
      if (!side) side = "HOME";
      state.lastSide = side;

      const slots = battingSlots(side);
      if (!slots.length) {
        lineupEl.innerHTML = `
          <div class="lineup-card lineup-card--idle">
            <div class="lineup-card__rows">Waiting for lineup…</div>
          </div>`;
        return;
      }

      const rowsHtml = slots.map(sl => {
        const isCurrent = batterId && sl.player_id === batterId;
        const rowClass  = isCurrent ? " lineup-row--current" : "";
        const name      = sl.player?.lastName ?? "";
        const pos       = sl.position ?? "";
        return `
          <div class="lineup-row${rowClass}">
            <div class="lineup-row__name">${escapeHtml(name)}</div>
            <div class="lineup-row__pos">${escapeHtml(pos)}</div>
          </div>`;
      }).join("");

      lineupEl.innerHTML = `
        <div class="lineup-card">
          <div class="lineup-card__rows">${rowsHtml}</div>
        </div>`;
    }

    // --- OTS polling ---
    function startOtsPolling() {
      if (otsInterval) return;
      refreshOts();
      refreshMlb();
      otsInterval    = setInterval(refreshOts, OTS_POLL_MS);
      mlbInterval    = setInterval(refreshMlb, OTS_POLL_MS);
      rotateInterval = setInterval(() => {
        if (ootGameOrder.length > 2) {
          rotateIndex = (rotateIndex + 2) % ootGameOrder.length;
          renderScores();
        }
      }, 7500);
    }

    function stopOtsPolling() {
      if (otsInterval)    { clearInterval(otsInterval);    otsInterval    = null; }
      if (mlbInterval)    { clearInterval(mlbInterval);    mlbInterval    = null; }
      if (rotateInterval) { clearInterval(rotateInterval); rotateInterval = null; }
      leagueData.clear();
      mlbData.clear();
      ootGameData.clear();
      ootGameOrder = [];
      rotateIndex  = 0;
    }

    // merge both sources, live first, then scheduled, then final
    function mergeGames() {
      const all = [];
      for (const [, g] of leagueData) all.push(g);
      for (const [, g] of mlbData)    all.push(g);
      all.sort((a, b) => ({ 2: 0, 1: 1, 3: 2 }[a.status] ?? 3) - ({ 2: 0, 1: 1, 3: 2 }[b.status] ?? 3));
      ootGameData.clear();
      ootGameOrder = all.map(g => g.id);
      all.forEach(g => ootGameData.set(g.id, g));
      rotateIndex = 0;
      renderScores();
    }

    // --- league games ---
    async function refreshOts() {
      const now  = new Date();
      const from = new Date(now); from.setHours(0, 0, 0, 0);
      const to   = new Date(now); to.setHours(23, 59, 59, 999);
      const q = new URLSearchParams({
        leagueId:      LEAGUE_ID,
        startDateFrom: from.toISOString(),
        startDateTo:   to.toISOString(),
        take:          50,
      });

      let games;
      try {
        const json = await fetchJson(`${API_BASE}/api/public/games?${q}`);
        games = Array.isArray(json) ? json : (json?.items ?? json?.data ?? []);
      } catch (e) {
        console.warn("[ots] fetch failed:", e.message);
        return;
      }

      const others = games.filter(g => g.gameGuid !== state.gameId);
      const toFetch = others.filter(g => g.gameStatusId === 2 || g.gameStatusId === 3);
      // gameStatusId 0 or 1 = scheduled, 2 = live, 3 = final
      const results = await Promise.allSettled(
        toFetch.map(g => fetchJson(`${API_BASE}/api/games/${g.gameGuid}/latest-score/internal`))
      );
      const scoreMap = new Map();
      toFetch.forEach((g, i) => {
        if (results[i].status === "fulfilled") scoreMap.set(g.gameGuid, results[i].value);
      });

      leagueData.clear();
      const short = (apiShort, name) =>
        apiShort || TEAM_SHORT[name] || name?.slice(0, 3).toUpperCase() || "???";

      for (const g of others) {
        const id        = g.gameGuid;
        const awayShort = short(g.awayTeam?.shortName, g.awayTeam?.name);
        const homeShort = short(g.homeTeam?.shortName, g.homeTeam?.name);

        if (g.gameStatusId === 0 || g.gameStatusId === 1) {
          const raw = g.scheduledDate ?? g.startDate ?? g.scheduledAt ?? g.gameDate ?? null;
          leagueData.set(id, { id, source: "league", status: 1, awayShort, homeShort, startTime: raw ? new Date(raw) : null });
        } else {
          const score = scoreMap.get(id);
          const away  = score?.teams?.AWAY;
          const home  = score?.teams?.HOME;
          const gs    = score?.gameStatus;
          leagueData.set(id, {
            id, source: "league",
            status:    g.gameStatusId,
            awayShort: short(away?.shortName, away?.name) || awayShort,
            homeShort: short(home?.shortName, home?.name) || homeShort,
            awayRuns:  away?.runs ?? 0,
            homeRuns:  home?.runs ?? 0,
            inning:    gs?.currentInning ?? 1,
            half:      gs?.inningHalf ?? "TOP",
          });
        }
      }

      mergeGames();
    }

    const MLB_TARGET = new Set([
      "Baltimore Orioles", "Philadelphia Phillies", "Pittsburgh Pirates",
      "Washington Nationals", "Boston Red Sox", "New York Yankees",
      "Cincinnati Reds", "Los Angeles Dodgers",
    ]);

    // --- MLB games (direct StatsAPI) ---
    async function refreshMlb() {
      const today = new Date().toISOString().slice(0, 10);
      let data;
      try {
        data = await fetchJson(`https://statsapi.mlb.com/api/v1/schedule/games?sportId=1&date=${today}`);
      } catch (e) {
        console.warn("[mlb] fetch failed:", e.message);
        return;
      }

      mlbData.clear();

      for (const dateBlock of data.dates ?? []) {
        for (const game of dateBlock.games ?? []) {
          const awayTeam  = game.teams.away;
          const homeTeam  = game.teams.home;
          const awayName  = awayTeam.team.name;
          const homeName  = homeTeam.team.name;
          const awayScore = awayTeam.score ?? 0;
          const homeScore = homeTeam.score ?? 0;

          if (!MLB_TARGET.has(awayName) && !MLB_TARGET.has(homeName)) continue;

          // only show Dodgers if winning or tied
          if (awayName === "Los Angeles Dodgers" && awayScore < homeScore) continue;
          if (homeName === "Los Angeles Dodgers" && homeScore < awayScore) continue;

          const id        = `mlb-${game.gamePk}`;
          const awayShort = MLB_ABBR[awayName] || awayName.slice(0, 3).toUpperCase();
          const homeShort = MLB_ABBR[homeName] || homeName.slice(0, 3).toUpperCase();
          const awayLogo  = `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${awayTeam.team.id}.svg`;
          const homeLogo  = `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${homeTeam.team.id}.svg`;

          const rawStatus = game.status.detailedState;
          let status;
          if (rawStatus === "In Progress" || rawStatus === "Warmup") {
            status = 2;
          } else if (rawStatus === "Final" || rawStatus === "Game Over" || rawStatus === "Completed Early") {
            status = 3;
          } else {
            status = 1;
          }

          mlbData.set(id, {
            id, source: "mlb",
            status,
            awayShort, homeShort,
            awayLogo, homeLogo,
            awayRuns:  awayScore,
            homeRuns:  homeScore,
            startTime: status === 1 ? new Date(game.gameDate) : null,
          });
        }
      }

      mergeGames();
    }

    // --- scores render ---
    function renderScores() {
      const pair = [0, 1].map(i => {
        if (!ootGameOrder.length) return null;
        const id = ootGameOrder[(rotateIndex + i) % ootGameOrder.length];
        return ootGameData.get(id) || null;
      });

      if (!pair.length || pair.every(g => !g)) {
        scoresEl.innerHTML = `<div class="scores-wrap"><div class="scores-empty">No games today</div></div>`;
        return;
      }
      while (pair.length < 2) pair.push(null);

      const blocks = pair.map(g => {
        if (!g) return `<div class="game-block"></div>`;

        const awayLogoSrc = g.source === "mlb" ? escapeHtml(g.awayLogo) : `logos/${escapeHtml(g.awayShort)}.png`;
        const homeLogoSrc = g.source === "mlb" ? escapeHtml(g.homeLogo) : `logos/${escapeHtml(g.homeShort)}.png`;

        if (g.status === 1) {
          const timeStr = g.startTime instanceof Date
            ? g.startTime.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true })
            : escapeHtml(g.startTime || "TBD");
          return `
            <div class="game-block">
              <div class="game-block__team">
                <img class="game-block__logo" src="${awayLogoSrc}" onerror="this.style.visibility='hidden'">
                <span class="game-block__abbr">${escapeHtml(g.awayShort)}</span>
              </div>
              <div class="game-block__team">
                <img class="game-block__logo" src="${homeLogoSrc}" onerror="this.style.visibility='hidden'">
                <span class="game-block__abbr">${escapeHtml(g.homeShort)}</span>
              </div>
              <div class="game-block__inn">${timeStr}</div>
            </div>`;
        }

        let inningLabel;
        if (g.status === 3) {
          inningLabel = "FINAL";
        } else if (g.source === "mlb") {
          inningLabel = "LIVE";
        } else {
          inningLabel = `${g.half === "TOP" ? "Top" : "Bot"} ${g.inning}`;
        }

        return `
          <div class="game-block">
            <div class="game-block__team">
              <img class="game-block__logo" src="${awayLogoSrc}" onerror="this.style.visibility='hidden'">
              <span class="game-block__abbr">${escapeHtml(g.awayShort)}</span>
              <span class="game-block__score">${g.awayRuns}</span>
            </div>
            <div class="game-block__team">
              <img class="game-block__logo" src="${homeLogoSrc}" onerror="this.style.visibility='hidden'">
              <span class="game-block__abbr">${escapeHtml(g.homeShort)}</span>
              <span class="game-block__score">${g.homeRuns}</span>
            </div>
            <div class="game-block__inn">${escapeHtml(inningLabel)}</div>
          </div>`;
      }).join("");

      scoresEl.innerHTML = `<div class="scores-wrap">${blocks}</div>`;
    }

    // --- leaders ---
    const STAT_CONFIG = {
      H:    { label: "HITS",    rate: false }, HR:   { label: "HR",      rate: false },
      RBI:  { label: "RBI",     rate: false }, R:    { label: "RUNS",    rate: false },
      BB:   { label: "WALKS",   rate: false }, SO:   { label: "K",       rate: false },
      SB:   { label: "SB",      rate: false }, TB:   { label: "TB",      rate: false },
      AVG:  { label: "AVG",     rate: true  }, OBP:  { label: "OBP",     rate: true  },
      SLG:  { label: "SLG",     rate: true  }, OPS:  { label: "OPS",     rate: true  },
      ERA:  { label: "ERA",     rate: true,  asc: true  },
      WHIP: { label: "WHIP",    rate: true,  asc: true  },
      W:    { label: "WINS",    rate: false }, SV:   { label: "SAVES",   rate: false },
      IP:   { label: "IP",      rate: false }, K:    { label: "K",       rate: false },
    };

    function getStatValue(item, stat) {
      const s = item.stats;
      if (!s) return null;
      const direct = s[stat];
      if (direct != null) return direct;
      return s.RATES?.[stat] ?? null;
    }

    function fmtStat(val, stat) {
      if (val == null) return "—";
      const n = typeof val === "number" ? val : parseFloat(val);
      if (!Number.isFinite(n)) return "—";
      const cfg = STAT_CONFIG[stat];
      if (!cfg?.rate) return String(Math.round(n));
      if (n < 2) {
        const s = n.toFixed(3);
        return s.startsWith("0.") ? s.slice(1) : s;
      }
      return n.toFixed(2);
    }

    async function fetchLeaders(type, stat) {
      if (!type || !stat) return;
      const endpoint  = type === "p" ? "pitching" : type === "r" ? "running" : "batting";
      const sortBy    = stat.toUpperCase();
      const cfg       = STAT_CONFIG[sortBy];
      const sortDir   = cfg?.asc ? "asc" : "desc";
      const label     = cfg?.label ?? sortBy;

      const q = new URLSearchParams({
        seasonId: SEASON_ID,
        leagueId: LEAGUE_ID,
        sortBy,
        sortDir,
        size: 5,
        page: 0,
      });

      try {
        const data  = await fetchJson(`${API_BASE}/api/api/leaderboard/player/${endpoint}?${q}`);
        const items = (data.items ?? data ?? []).slice(0, 5);
        renderLeaders(items, sortBy, label);
      } catch (e) {
        console.error("[leaders] fetch failed:", e);
        leadersEl.innerHTML = `<div class="leaders-wrap"><div class="leaders-header">Failed to load</div></div>`;
      }
    }

    function renderLeaders(items, stat, label) {
      const rows = items.map((item, i) => {
        const isYork  = item.teamName === "York Revolution";
        const abbr    = TEAM_SHORT[item.teamName] || item.teamName?.slice(0, 3).toUpperCase() || "";
        const val     = fmtStat(getStatValue(item, stat), stat);
        return `
          <div class="leader-row${isYork ? " leader-row--york" : ""}">
            <span class="leader-rank">${i + 1}</span>
            <div class="leader-info">
              <div class="leader-name">${escapeHtml(item.lastName)}</div>
              <div class="leader-team">${escapeHtml(abbr)}</div>
            </div>
            <span class="leader-val">${escapeHtml(val)}</span>
          </div>`;
      }).join("");

      leadersEl.innerHTML = `
        <div class="leaders-wrap">
          <div class="leaders-header">${escapeHtml(label)} Leaders</div>
          <div class="leaders-rows">${rows}</div>
        </div>`;
    }

    // --- standings ---
    function fmtGB(gb) {
      if (gb === 0) return "—";
      const whole = Math.floor(gb);
      const half  = (gb % 1) >= 0.4;
      if (whole === 0) return "½";
      return half ? `${whole}½` : String(whole);
    }

    async function fetchStandings() {
      try {
        const data = await fetchJson(`${API_BASE}/api/leagues/standings?seasonId=${SEASON_ID}`);
        renderStandings(data);
      } catch (e) {
        console.error("[standings] fetch failed:", e);
        leadersEl.innerHTML = `<div class="standings-wrap"><div class="standings-header">Failed to load</div></div>`;
      }
    }

    function renderStandings(data) {
      let teams = Array.isArray(data) ? data
        : (data?.teams ?? data?.items ?? data?.standings ?? []);

      teams = teams.filter(t => NORTH_TEAMS.has(t.teamName ?? t.name ?? ""));

      if (!teams.length) {
        leadersEl.innerHTML = `<div class="standings-wrap"><div class="standings-header">No standings data</div></div>`;
        return;
      }

      const getW = t => t.W ?? t.wins ?? t.w ?? 0;
      const getL = t => t.L ?? t.losses ?? t.l ?? 0;

      teams.sort((a, b) => {
        const wDiff = getW(b) - getW(a);
        return wDiff !== 0 ? wDiff : getL(a) - getL(b);
      });

      const leaderW = getW(teams[0]);
      const leaderL = getL(teams[0]);

      const rows = teams.map((t, i) => {
        const name   = t.teamName ?? t.name ?? "";
        const short  = TEAM_SHORT[name] || name.slice(0, 3).toUpperCase();
        const w      = getW(t);
        const l      = getL(t);
        const gb     = i === 0 ? 0 : ((leaderW - w) + (l - leaderL)) / 2;
        const isYork = name === "York Revolution";
        return `
          <div class="standing-row${isYork ? " standing-row--york" : ""}">
            <span class="standing-team">${escapeHtml(short)}</span>
            <span class="standing-wl">${w}</span>
            <span class="standing-wl">${l}</span>
            <span class="standing-gb">${fmtGB(gb)}</span>
          </div>`;
      }).join("");

      leadersEl.innerHTML = `
        <div class="standings-wrap">
          <div class="standings-header">North Standings</div>
          <div class="standings-colheads">
            <span></span>
            <span>W</span>
            <span>L</span>
            <span>GB</span>
          </div>
          <div class="standings-rows">${rows}</div>
        </div>`;
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
