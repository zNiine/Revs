<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iScore → Firebase Sync</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    h2 { color: #F2B233; }
    .status { margin: 8px 0; }
    .ok  { color: #4caf50; }
    .err { color: #f44336; }
    .dim { color: #888; }
    pre { background: #1e1e1e; padding: 12px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>iScore → Firebase Sync</h2>
  <div class="status dim" id="status">Starting…</div>
  <pre id="log"></pre>

  <script>
    const ISCORE_URL = "https://api.microservices.iscoresports.com/api/games/a494e287-b103-4ac1-adfa-50de4d2ec88b/latest-score/internal";
    const FB_BASE    = "https://revs-2c987-default-rtdb.firebaseio.com";
    const POLL_MS    = 5000;

    let lastBatterId  = null;
    let lastPitcherId = null;

    const statusEl = document.getElementById("status");
    const logEl    = document.getElementById("log");

    function log(msg, cls = "") {
      const line = document.createElement("div");
      line.className = cls;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.prepend(line);
      if (logEl.children.length > 40) logEl.lastChild.remove();
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    async function writeFB(path, data) {
      const r = await fetch(`${FB_BASE}/${path}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(`FB write failed: HTTP ${r.status}`);
    }

    function batterPayload(batter) {
      const s = batter.batterStats?.season ?? {};
      return {
        name:     `${batter.firstName} ${batter.lastName}`,
        position: batter.position ?? "",
        average:  s.avg  ?? "",
        obp:      s.obp  ?? "",
        slg:      s.slg  ?? "",
        hr:       String(s.hr  ?? ""),
        rbi:      String(s.rbi ?? "")
      };
    }

    async function poll() {
      try {
        const data = await fetchJson(ISCORE_URL);

        const batter  = data.batter;
        const pitcher = data.pitcher;

        if (batter && batter.playerId !== lastBatterId) {
          const payload = batterPayload(batter);
          await writeFB("scoreboard/score_batter", payload);
          lastBatterId = batter.playerId;
          log(`Batter → ${payload.name} (${payload.position}) avg:${payload.average}`, "ok");
        }

        // pitcher slot — awaiting your direction, just detecting change for now
        if (pitcher && pitcher.playerId !== lastPitcherId) {
          lastPitcherId = pitcher.playerId;
          log(`Pitcher changed → ${pitcher.firstName} ${pitcher.lastName} (${pitcher.jerseyNumber}) — awaiting write direction`, "dim");
        }

        statusEl.className = "status ok";
        statusEl.textContent = `Live — last poll ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        log(`Error: ${e.message}`, "err");
        statusEl.className = "status err";
        statusEl.textContent = `Error: ${e.message}`;
      }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
