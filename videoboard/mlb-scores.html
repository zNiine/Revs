<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLB Scores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 814.3966684723727px;
      height: 120px;
      overflow: hidden;
      background: #0a0a0c;
      color: #f2f2f4;
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #board {
      display: flex;
      height: 100%;
      width: 100%;
      align-items: stretch;
    }

    .game {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 12px;
      flex: 1;
      min-width: 0;
    }
    .game + .game { border-left: 1px solid rgba(255,255,255,0.12); }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .team__logo { width: 36px; height: 36px; object-fit: contain; flex-shrink: 0; }
    .team__abbr {
      flex: 1;
      font-size: 22px; font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .team__score {
      font-size: 30px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .game__status {
      text-align: right;
      font-size: 25px; font-weight: 800;
      color: #ffe066;
      padding-top: 3px;
    }
    .empty {
      display: flex; align-items: center; justify-content: center;
      width: 100%; color: rgba(255,255,255,0.3); font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="board"></div>

  <script>
    const PAGE_SIZE = 5;
    const POLL_MS   = 60000;

    const MLB_TARGET = new Set([
      "Baltimore Orioles", "Philadelphia Phillies", "Pittsburgh Pirates",
      "Washington Nationals", "Boston Red Sox", "New York Yankees",
      "Cincinnati Reds", "Los Angeles Dodgers", "Arizona Diamondbacks", "Atlanta Braves", "Chicago Cubs", "S"
    ]);

    const MLB_ABBR = {
      "Baltimore Orioles":      "BAL",  "Philadelphia Phillies":  "PHI",
      "Pittsburgh Pirates":     "PIT",  "Washington Nationals":   "WSH",
      "Boston Red Sox":         "BOS",  "New York Yankees":       "NYY",
      "Cincinnati Reds":        "CIN",  "Los Angeles Dodgers":    "LAD",
      "New York Mets":          "NYM",  "Atlanta Braves":         "ATL",
      "Miami Marlins":          "MIA",  "Toronto Blue Jays":      "TOR",
      "Tampa Bay Rays":         "TB",   "Chicago White Sox":      "CWS",
      "Chicago Cubs":           "CHC",  "Cleveland Guardians":    "CLE",
      "Detroit Tigers":         "DET",  "Kansas City Royals":     "KC",
      "Minnesota Twins":        "MIN",  "Houston Astros":         "HOU",
      "Los Angeles Angels":     "LAA",  "Oakland Athletics":      "OAK",
      "Seattle Mariners":       "SEA",  "Texas Rangers":          "TEX",
      "Arizona Diamondbacks":   "ARI",  "Colorado Rockies":       "COL",
      "San Diego Padres":       "SD",   "San Francisco Giants":   "SF",
      "St. Louis Cardinals":    "STL",  "Milwaukee Brewers":      "MIL",
    };

    let games = [];
    let page  = 0;

    const board = document.getElementById("board");

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    async function poll() {
      const today = new Date().toISOString().slice(0, 10);
      let data;
      try {
        data = await fetchJson(`https://statsapi.mlb.com/api/v1/schedule/games?sportId=1&date=${today}&hydrate=linescore`);
      } catch (e) {
        console.warn("[mlb] fetch failed:", e.message);
        return;
      }

      const result = [];
      for (const dateBlock of data.dates ?? []) {
        for (const game of dateBlock.games ?? []) {
          const awayTeam  = game.teams.away;
          const homeTeam  = game.teams.home;
          const awayName  = awayTeam.team.name;
          const homeName  = homeTeam.team.name;
          const awayScore = awayTeam.score ?? 0;
          const homeScore = homeTeam.score ?? 0;

          if (!MLB_TARGET.has(awayName) && !MLB_TARGET.has(homeName)) continue;

          // only show Dodgers if winning or tied
          if (awayName === "Los Angeles Dodgers" && awayScore < homeScore) continue;
          if (homeName === "Los Angeles Dodgers" && homeScore < awayScore) continue;

          const rawStatus = game.status.detailedState;
          let status;
          if (rawStatus === "In Progress" || rawStatus === "Warmup") {
            status = 2;
          } else if (rawStatus === "Final" || rawStatus === "Game Over" || rawStatus === "Completed Early") {
            status = 3;
          } else {
            status = 1;
          }

          const ls       = game.linescore;
          const inning   = ls?.currentInning ?? null;
          const innState = ls?.inningState ?? "";
          // "Top" → "Top", "Bottom" → "Bot", "Middle"/"End" → "Mid"/"End"
          const innHalf  = innState === "Bottom" ? "Bot"
                         : innState === "Middle" ? "Mid"
                         : innState || "Top";

          result.push({
            awayAbbr:  MLB_ABBR[awayName] || awayName.slice(0, 3).toUpperCase(),
            homeAbbr:  MLB_ABBR[homeName] || homeName.slice(0, 3).toUpperCase(),
            awayLogo:  `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${awayTeam.team.id}.svg`,
            homeLogo:  `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${homeTeam.team.id}.svg`,
            awayScore, homeScore, status,
            inning, innHalf,
            startTime: status === 1 ? new Date(game.gameDate) : null,
          });
        }
      }

      // live first, then scheduled, then final
      result.sort((a, b) => ({ 2: 0, 1: 1, 3: 2 }[a.status] ?? 3) - ({ 2: 0, 1: 1, 3: 2 }[b.status] ?? 3));
      games = result;
      page  = 0;
      render();
    }

    function render() {
      if (!games.length) {
        board.innerHTML = `<div class="empty">No MLB games today</div>`;
        return;
      }

      const slice = Array.from({ length: PAGE_SIZE }, (_, i) =>
        games[(page + i) % games.length]
      );

      board.innerHTML = slice.map(g => {
        let statusLabel;
        if (g.status === 3) {
          statusLabel = "FINAL";
        } else if (g.status === 2) {
          statusLabel = g.inning ? `${g.innHalf} ${g.inning}` : "LIVE";
        } else {
          statusLabel = g.startTime
            ? g.startTime.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true })
            : "TBD";
        }

        return `
          <div class="game">
            <div class="team">
              <img class="team__logo" src="${escapeHtml(g.awayLogo)}" onerror="this.style.visibility='hidden'">
              <span class="team__abbr">${escapeHtml(g.awayAbbr)}</span>
              ${g.status !== 1 ? `<span class="team__score">${g.awayScore}</span>` : ""}
            </div>
            <div class="team">
              <img class="team__logo" src="${escapeHtml(g.homeLogo)}" onerror="this.style.visibility='hidden'">
              <span class="team__abbr">${escapeHtml(g.homeAbbr)}</span>
              ${g.status !== 1 ? `<span class="team__score">${g.homeScore}</span>` : ""}
            </div>
            <div class="game__status">${escapeHtml(statusLabel)}</div>
          </div>`;
      }).join("");
    }

    setInterval(() => {
      if (games.length > PAGE_SIZE) {
        page = (page + PAGE_SIZE) % games.length;
        render();
      }
    }, 7500);

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
