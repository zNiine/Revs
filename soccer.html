<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Score</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 326px;
      height: 160px;
      overflow: hidden;
      background: #0a0a0c;
      color: #f2f2f4;
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 9px 12px 8px;
      gap: 0;
    }

    /* ── top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .competition {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffe066;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: 800;
      color: #ffe066;
    }
    .status-badge.live { color: #22c55e; }
    .status-badge.pre  { color: #888; font-size: 16px; }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }

    /* ── score row ── */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0 8px;
      margin-bottom: 6px;
    }

    .team { display: flex; align-items: center; gap: 8px; }
    .team.away { flex-direction: row-reverse; }

    .logo {
      width: 38px; height: 38px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .team-info { display: flex; flex-direction: column; }
    .team-info.away { align-items: flex-end; }
    .team-abbr {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }
    .team-name {
      font-size: 10px;
      font-weight: 700;
      color: #5a6480;
      letter-spacing: 0.03em;
      line-height: 1;
      margin-top: 2px;
    }

    .scores {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .score {
      font-family: Impact, "Arial Narrow", "Franklin Gothic Heavy", sans-serif;
      font-size: 50px;
      line-height: 1;
      min-width: 30px;
      text-align: center;
      letter-spacing: -1px;
    }
    .sep {
      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 30px;
      color: #222;
      line-height: 1;
    }

    /* ── bottom: scorers full width ── */
    .bottom {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 5px;
    }
    .scorers {
      font-size: 15px;
      font-weight: 700;
      color: #c8d0e8;
      line-height: 1.5;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
<div class="card">

  <div class="topbar">
    <span class="competition" id="competition">FIFA World Cup 2026</span>
    <span class="status-badge" id="statusBadge">…</span>
  </div>

  <div class="scoreboard">
    <div class="team">
      <img class="logo" id="logoHome" src="" alt="" />
      <div class="team-info">
        <span class="team-abbr" id="abbrHome">—</span>
        <span class="team-name" id="nameHome"></span>
      </div>
    </div>

    <div class="scores">
      <span class="score" id="scoreHome">-</span>
      <span class="sep">:</span>
      <span class="score" id="scoreAway">-</span>
    </div>

    <div class="team away">
      <img class="logo" id="logoAway" src="" alt="" />
      <div class="team-info away">
        <span class="team-abbr" id="abbrAway">—</span>
        <span class="team-name" id="nameAway"></span>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="scorers" id="scorers"></div>
  </div>

</div>

<script>
  const HOME_TEAM = 'Belgium';
  const AWAY_TEAM = 'Senegal';

  const POLL_MS = 30_000;
  const BASE    = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';

  const $ = id => document.getElementById(id);

  const SLUG_LABEL = {
    'group-stage':       'Group Stage',
    'round-of-32':       'Round of 32',
    'round-of-16':       'Round of 16',
    'quarterfinals':     'Quarterfinals',
    'semifinals':        'Semifinals',
    'third-place':       '3rd Place',
    'final':             'Final',
  };

  function findGame(events, home, away) {
    const h = home.toLowerCase(), a = away.toLowerCase();
    return events.find(e => {
      const names = (e.competitions?.[0]?.competitors || [])
        .map(c => (c.team?.displayName || '').toLowerCase());
      return names.some(n => n.includes(h)) && names.some(n => n.includes(a));
    });
  }

  function buildScorers(details, homeId, awayId) {
    const goals = (details || []).filter(d => d.scoringPlay && !d.ownGoal);
    const homeGoals = [], awayGoals = [];
    goals.forEach(d => {
      const scorer = d.athletesInvolved?.[0]?.shortName || '?';
      const min    = d.clock?.displayValue || '';
      const entry  = `${scorer} ${min}`;
      if (String(d.team?.id) === String(homeId)) homeGoals.push(entry);
      else awayGoals.push(entry);
    });
    return { homeGoals, awayGoals };
  }

  function render(event) {
    const comp        = event.competitions[0];
    const competitors = comp.competitors;
    const status      = comp.status;
    const state       = status.type.state;
    const detail      = status.type.shortDetail;
    const slug        = event.season?.slug || '';

    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];

    $('competition').textContent = 'FIFA World Cup 2026';

    // teams
    $('logoHome').src         = home.team.logo || '';
    $('logoAway').src         = away.team.logo || '';
    $('abbrHome').textContent = home.team.abbreviation;
    $('abbrAway').textContent = away.team.abbreviation;
    $('nameHome').textContent = home.team.shortDisplayName || home.team.displayName;
    $('nameAway').textContent = away.team.shortDisplayName || away.team.displayName;

    // scores
    $('scoreHome').textContent = state === 'pre' ? '-' : (home.score ?? '-');
    $('scoreAway').textContent = state === 'pre' ? '-' : (away.score ?? '-');

    // status badge
    const badge = $('statusBadge');
    if (state === 'in') {
      badge.className   = 'status-badge live';
      badge.innerHTML   = `<span class="dot"></span>${detail}`;
    } else if (state === 'post') {
      badge.className   = 'status-badge';
      badge.textContent = detail || 'FT';
    } else {
      badge.className   = 'status-badge pre';
      badge.textContent = status.type.detail?.match(/\d+:\d+ [AP]M/)?.[0] || detail;
    }

    // scorers
    const { homeGoals, awayGoals } = buildScorers(comp.details, home.team.id, away.team.id);
    const allGoals = [
      ...homeGoals.map(g => ({ text: g, cls: 'scorer-goal' })),
      ...awayGoals.map(g => ({ text: g, cls: 'scorer-goal' })),
    ];
    $('scorers').innerHTML = allGoals.length
      ? allGoals.map(g => `<span class="${g.cls}">${g.text}</span>`).join('<br>')
      : '';

  }

  async function poll() {
    const today  = new Date();
    const pad    = n => String(n).padStart(2,'0');
    const todayStr = `${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}`;
    const gameDay  = '20260701';

    try {
      for (const dates of [todayStr, gameDay]) {
        const res    = await fetch(`${BASE}?dates=${dates}`);
        const data   = await res.json();
        const game   = findGame(data.events || [], HOME_TEAM, AWAY_TEAM);
        if (game) { render(game); return; }
      }
      $('statusBadge').textContent = 'Not found';
    } catch(e) { console.error('Poll error:', e); }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
