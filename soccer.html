<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Score</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 250px;
      height: 65px;
      overflow: hidden;
      background: transparent;
      color: #f2f2f4;
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5px 8px;
      background: linear-gradient(135deg, #000000 0%, #000000 100%);

      gap: 0;
    }

    /* ── score row: flag | score | clock | score | flag ── */
    .scoreboard {
      display: grid;
      grid-template-columns: auto auto 1fr auto auto;
      align-items: center;
    }

    .logo {
      width: 60px; height: 55px;
      object-fit: contain;
      /* glow applied dynamically per team */
    }
    #logoHome { justify-self: start; margin-right: 4px; }
    #logoAway { justify-self: end; margin-left: 4px; }

    .score {
      font-family: Impact, "Arial Narrow", "Franklin Gothic Heavy", sans-serif;
      font-size: 45px;
      line-height: 1;
      letter-spacing: -1px;
      text-align: center;
    }

    .clock {
      text-align: center;
      font-size: 25px;
      font-weight: 1000;
      color: #ffe066;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .clock.live { color: #ffe066; }
    .clock.pre  { color: #888; font-size: 18px; }

    .dot {
      width: 0px; height: 0px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }

  </style>
</head>
<body>
<div class="card">

  <div class="scoreboard">
    <img class="logo" id="logoHome" src="" alt="" />
    <span class="score" id="scoreHome">-</span>
    <div class="clock" id="clock">…</div>
    <span class="score" id="scoreAway">-</span>
    <img class="logo" id="logoAway" src="" alt="" />
  </div>


</div>

<script>
  const HOME_TEAM = 'Belgium';   // live game for score/clock
  const AWAY_TEAM = 'Senegal';

  // Always show these logos regardless of which game we're pulling score from
  const LOGO_HOME = 'https://a.espncdn.com/i/teamlogos/countries/500/usa.png';
  const LOGO_AWAY = 'https://a.espncdn.com/i/teamlogos/countries/500/bih.png';
  const GLOW_HOME = 'United States';
  const GLOW_AWAY = 'Bosnia-Herzegovina';

  const POLL_MS = 30_000;
  const BASE    = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';

  const $ = id => document.getElementById(id);

  // Flag glow colors per team [color1, color2]
  const FLAG_GLOW = {
    'united states':          ['#B22234', '#ffffff'],
    'bosnia-herzegovina':     ['#002395', '#FFCC00'],
    'france':                 ['#002395', '#ffffff'],
    'sweden':                 ['#006AA7', '#FECC02'],
    'belgium':                ['#EF3340', '#F8D800'],
    'senegal':                ['#00853F', '#FDEF42'],
    'england':                ['#CF111A', '#ffffff'],
    'brazil':                 ['#009C3B', '#FFDF00'],
    'argentina':              ['#74ACDF', '#ffffff'],
    'germany':                ['#DD0000', '#FFCE00'],
    'spain':                  ['#AA151B', '#F1BF00'],
    'portugal':               ['#006600', '#FF0000'],
    'netherlands':            ['#AE1C28', '#21468B'],
    'mexico':                 ['#006847', '#CE1126'],
    'canada':                 ['#FF0000', '#ffffff'],
    'japan':                  ['#BC002D', '#ffffff'],
  };

  function teamGlow(displayName) {
    const key = (displayName || '').toLowerCase();
    const colors = FLAG_GLOW[key] || ['#ffffff', '#cccccc'];
    const [c1, c2] = colors;
    return `drop-shadow(0 0 2px ${c1}) drop-shadow(0 0 5px ${c1}) drop-shadow(0 0 2px ${c2}) drop-shadow(0 0 6px ${c2})`;
  }

  function findGame(events, home, away) {
    const h = home.toLowerCase(), a = away.toLowerCase();
    return events.find(e => {
      const names = (e.competitions?.[0]?.competitors || [])
        .map(c => (c.team?.displayName || '').toLowerCase());
      return names.some(n => n.includes(h)) && names.some(n => n.includes(a));
    });
  }

  function buildScorers(details, homeId, awayId) {
    const goals = (details || []).filter(d => d.scoringPlay && !d.ownGoal);
    const home = [], away = [];
    goals.forEach(d => {
      const name = d.athletesInvolved?.[0]?.shortName || '?';
      const min  = d.clock?.displayValue || '';
      (String(d.team?.id) === String(homeId) ? home : away).push(`${name} ${min}`);
    });
    // interleave: home goals left, away goals right, separated by dash
    const parts = [];
    if (home.length) parts.push(home.join(', '));
    if (away.length) parts.push(away.join(', '));
    return parts.join('  ·  ');
  }

  function render(event) {
    const comp        = event.competitions[0];
    const competitors = comp.competitors;
    const status      = comp.status;
    const state       = status.type.state;
    const detail      = status.type.shortDetail;

    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];

    $('logoHome').src = LOGO_HOME;
    $('logoAway').src = LOGO_AWAY;
    $('logoHome').style.filter = teamGlow(GLOW_HOME);
    $('logoAway').style.filter = teamGlow(GLOW_AWAY);


    $('scoreHome').textContent = state === 'pre' ? '-' : (home.score ?? '-');
    $('scoreAway').textContent = state === 'pre' ? '-' : (away.score ?? '-');

    const clockEl = $('clock');
    if (state === 'in') {
      clockEl.className = 'clock live';
      const match = detail.match(/^(\d+'\s*)\+(\d+')$/);
      if (match) {
        clockEl.innerHTML = `<span style="display:flex;flex-direction:column;align-items:center;line-height:1"><span>${match[1]}</span><span style="font-size:0.55em;opacity:0.85">+${match[2]}</span></span>`;
      } else {
        clockEl.innerHTML = `${detail}`;
      }
    } else if (state === 'post') {
      clockEl.className = 'clock';
      clockEl.textContent = detail || 'FT';
    } else {
      clockEl.className = 'clock pre';
      clockEl.textContent = status.type.detail?.match(/\d+:\d+ [AP]M/)?.[0] || detail;
    }

  }

  async function poll() {
    const today   = new Date();
    const pad     = n => String(n).padStart(2, '0');
    const todayStr = `${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}`;
    const gameDay  = '20260701';

    try {
      for (const dates of [todayStr, gameDay]) {
        const res  = await fetch(`${BASE}?dates=${dates}`);
        const data = await res.json();
        const game = findGame(data.events || [], HOME_TEAM, AWAY_TEAM);
        if (game) { render(game); return; }
      }
      $('clock').textContent = 'Not found';
    } catch(e) { console.error('Poll error:', e); }
  }

  poll().then(() => {
    // Simulate 88' for preview
    const clockEl = $('clock');
    clockEl.className = 'clock live';
    clockEl.innerHTML = `88'`;
  });
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
