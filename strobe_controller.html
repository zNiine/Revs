<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Show — Operator</title>
<style>
  :root { --bg:#0b0b0f; --card:#14141a; --fg:#fff; --muted:#9aa3b2; --accent:#69f; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto}
  .wrap{max-width:920px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  h1{font-size:22px;margin:0 0 8px}
  h2{font-size:16px;margin:0 0 10px;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:6px 0 4px}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a34;background:#0f0f14;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button{padding:12px;border:0;border-radius:12px;background:#2b3140;color:#fff;font-weight:600;cursor:pointer}
  button.accent{background:var(--accent);color:#000}
  button.warn{background:#f66;color:#000}
  .stat{font:12px/1.2 system-ui;color:var(--muted)}
  .flex{display:flex;gap:10px;align-items:center}
  .stack{display:grid;gap:10px}
  .kbd{background:#000;padding:2px 6px;border-radius:6px;border:1px solid #333;color:#aaa}
  pre { white-space:pre-wrap; }
</style>
<body>
<div class="wrap">
  <div class="row">
    <div class="card">
      <h1>Operator Panel</h1>
      <div class="stat" id="status">–</div>
      <div class="stack" style="margin-top:8px">
        <label>Show ID</label>
        <input id="showId" value="sweet-caroline" />
        <div class="grid">
          <button id="loadShow">Load</button>
          <button id="saveMeta">Save Meta</button>
          <button id="resetShow" class="warn">Reset t0</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="stack">
          <h2>Meta</h2>
          <label>Title</label>
          <input id="title" placeholder="Sweet Caroline">
          <label>BPM</label>
          <input id="bpm" type="number" min="40" max="220" value="126">
          <label>Bars</label>
          <input id="bars" type="number" min="1" max="256" value="64">
        </div>
        <div class="stack">
          <h2>Audio</h2>
          <label>Storage path</label>
          <input id="audioPath" placeholder="audio/sweet-caroline-demo.mp3">
          <label>Gain (dB)</label>
          <input id="gainDb" type="number" value="-3">
          <label>Lead-In (ms)</label>
          <input id="leadIn" type="number" value="3000">
        </div>
      </div>
    </div>

    <div class="card">
      <h1>Arm Start</h1>
      <div class="stack">
        <div class="grid">
          <button id="arm3" class="accent">Start in 3s</button>
          <button id="arm5" class="accent">Start in 5s</button>
          <button id="armNextBar" class="accent">Start @ Next Bar</button>
        </div>
        <div class="grid">
          <button id="stopNow" class="warn">Stop Now (torch/screen off)</button>
          <button id="clearPatterns">Clear Patterns</button>
          <button id="pushChorus">Load Chorus Preset</button>
        </div>
        <div class="stat">
          Tips: Use <span class="kbd">Start @ Next Bar</span> while the PA track is rolling to lock the grid.
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h1>Live Cues</h1>
      <div class="grid">
        <button id="blastNow">Blast now</button>
        <button id="whiteOut4">Whiteout 1 beat</button>
        <button id="strobe2s">Strobe 2s @ 8 Hz</button>
      </div>
      <div class="grid" style="margin-top:10px">
        <button id="torchOn">Torch ON</button>
        <button id="torchOff">Torch OFF</button>
        <button id="screenBlack">Screen Black</button>
      </div>
    </div>

    <div class="card">
      <h1>Debug / Time</h1>
      <div class="stat" id="timeInfo">–</div>
      <pre class="stat" id="currShow">–</pre>
    </div>
  </div>
</div>

<script type="module">
/* ===========================================
   OPERATOR — v1.2 (with heavy logging)
   =========================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js';
import { getDatabase, ref, get, set, update, onValue } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js';

console.log("[O1] Operator script start.");

const firebaseConfig = {
  apiKey: "AIzaSyBgBqrrRBB1vvAnQ9mNBt9Vq6p2NWeKYZw",
  authDomain: "revs-2c987.firebaseapp.com",
  projectId: "revs-2c987",
  storageBucket: "revs-2c987.appspot.com",
  messagingSenderId: "181256684157",
  appId: "1:181256684157:web:a9e1c5dfd767658e2ba714",
  measurementId: "G-2050889X0C",
  databaseURL: "https://revs-2c987-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
console.log("[O2] Firebase app initialized.");
const db  = getDatabase(app);
console.log("[O3] RTDB handle created.");

// UI els
const el = id => document.getElementById(id);
const showId   = el('showId');
const status   = el('status');
const title    = el('title');
const bpm      = el('bpm');
const bars     = el('bars');
const audioPath= el('audioPath');
const gainDb   = el('gainDb');
const leadIn   = el('leadIn');
const timeInfo = el('timeInfo');
const currShow = el('currShow');

console.log("[O4] DOM bound.");

// Server time
const offsetRef = ref(db, '.info/serverTimeOffset');
let serverOffset = 0;
onValue(offsetRef, snap => {
  serverOffset = snap.val()|0;
  // console.log("[O5] serverOffset =", serverOffset);
});
const serverNow = () => Date.now() + serverOffset;

// Helpers
function sref(path){ return ref(db, path); }
function logStatus(t){ status.textContent = t; console.log("[STATUS]", t); }

async function loadShow(){
  const id = showId.value.trim();
  console.log("[O6] loadShow(%s)", id);
  const snap = await get(sref(`shows/${id}`));
  if (!snap.exists()) {
    logStatus('No show doc; creating with Save Meta…');
    await saveMeta();
    return;
  }
  const s = snap.val();
  console.log("[O7] Loaded show:", s);
  title.value = s.title ?? '';
  bpm.value   = s?.tempo?.bpm ?? 126;
  bars.value  = s?.grid?.bars ?? 64;
  audioPath.value = s?.audio?.storagePath ?? '';
  gainDb.value    = s?.audio?.gainDb ?? -3;
  leadIn.value    = s?.audio?.leadInMs ?? 3000;
  renderShow(s);
}

function renderShow(s){
  const info = {
    t0: s.t0 || 0,
    title: s.title || '',
    bpm: s?.tempo?.bpm,
    bars: s?.grid?.bars,
    patterns: (s.patterns||[]).length
  };
  currShow.textContent = JSON.stringify(info, null, 2);
  console.log("[O8] renderShow:", info);
}

onValue(sref(`shows/${showId.value}`), snap=>{
  if (snap.exists()) {
    console.log("[O9] shows value event.");
    renderShow(snap.val());
  }
});

async function saveMeta(){
  const id = showId.value.trim();
  console.log("[O10] saveMeta(%s)", id);
  const payload = {
    title: title.value || 'Untitled',
    audio: {
      storagePath: audioPath.value || null,
      gainDb: Number(gainDb.value||-3),
      leadInMs: Number(leadIn.value||3000)
    },
    tempo: { bpm: Number(bpm.value||126), ts: "4/4" },
    grid: { mode: "bpm", bars: Number(bars.value||64) }
  };
  await update(sref(`shows/${id}`), payload);
  logStatus('Meta saved.');
}

async function setT0(ms){
  const id = showId.value.trim();
  console.log("[O11] setT0(%d)", ms);
  await update(sref(`shows/${id}`), { t0: ms });
}

async function resetT0(){
  const id = showId.value.trim();
  console.log("[O12] resetT0()");
  await update(sref(`shows/${id}`), { t0: 0 });
}

function nextBarStartMs(nowAbs, bpmVal, barBeats=4){
  const beatMs = 60000/Math.max(40, Math.min(220, bpmVal));
  const barMs  = beatMs * barBeats;
  const n = Math.floor((nowAbs + 1000) / barMs) + 1;
  const abs = n*barMs; // absolute UTC ms (epoch), aligned to bar grid
  console.log("[O13] nextBarStartMs now=%d bpm=%d barMs=%d -> %d", nowAbs, bpmVal, barMs, abs);
  return abs;
}

async function setPatterns(arr){
  const id = showId.value.trim();
  console.log("[O14] setPatterns len=%d", arr.length);
  await update(sref(`shows/${id}`), { patterns: arr });
  logStatus(`Patterns: ${arr.length}`);
}

async function torchCommand(atMs, on){
  const id = showId.value.trim();
  console.log("[O15] torchCommand at=%d on=%s", atMs, on);
  await set(sref(`shows/${id}/liveTorch`), { type:'torch', at: atMs, on: !!on, atClient: serverNow() });
}

function chorusPreset(){
  console.log("[O16] chorusPreset()");
  return [
    { atBeat: 21, type:'strobe', hz:8, duty:0.35, lenBeats: 4 },
    { atBeat: 25, type:'blast',  lenBeats: 1 },
    { atBeat: 26, type:'blast',  lenBeats: 1 },
    { atBeat: 27, type:'blast',  lenBeats: 1 },
    { atBeat: 28, type:'strobe', hz:6, duty:0.30, lenBeats: 4 }
  ];
}

// Bindings
document.getElementById('loadShow').onclick = loadShow;
document.getElementById('saveMeta').onclick = saveMeta;
document.getElementById('resetShow').onclick = async ()=>{
  await resetT0();
  logStatus('t0 cleared');
};

document.getElementById('arm3').onclick = async ()=>{
  const t = serverNow() + 3000;
  console.log("[O17] arm3 -> t0=%d", t);
  await setT0(t);
  logStatus('Armed in 3s');
};
document.getElementById('arm5').onclick = async ()=>{
  const t = serverNow() + 5000;
  console.log("[O18] arm5 -> t0=%d", t);
  await setT0(t);
  logStatus('Armed in 5s');
};
document.getElementById('armNextBar').onclick = async ()=>{
  const nowS = serverNow();
  const barAbs = nextBarStartMs(nowS, Number(bpm.value||126));
  console.log("[O19] armNextBar -> t0=%d", barAbs);
  await setT0(barAbs);
  logStatus('Armed at next bar');
};

document.getElementById('clearPatterns').onclick = async ()=>{
  console.log("[O20] clearPatterns()");
  await setPatterns([]);
};
document.getElementById('pushChorus').onclick = async ()=>{
  console.log("[O21] pushChorus()");
  await setPatterns(chorusPreset());
  logStatus('Chorus preset loaded');
};

document.getElementById('blastNow').onclick = async ()=>{
  console.log("[O22] blastNow()");
  await setPatterns([{ atMs: 0, type: 'blast', lenBeats:1 }]); // marker
  const at = serverNow();
  await torchCommand(at, true);
  setTimeout(()=>torchCommand(serverNow(), false), 120);
};

document.getElementById('whiteOut4').onclick = async ()=>{
  console.log("[O23] whiteOut4()");
  const at = serverNow();
  await torchCommand(at, true);
  setTimeout(()=>torchCommand(serverNow(), false), 480); // ~1 beat around 126bpm
};

document.getElementById('strobe2s').onclick = async ()=>{
  console.log("[O24] strobe2s()");
  const id = showId.value.trim();
  const s = await get(sref(`shows/${id}`));
  const show = s.val() || {};
  const t0 = show.t0 || serverNow();
  const rel = Math.max(0, serverNow() - t0);
  const arr = (show.patterns || []).slice();
  const bpmVal = Number(bpm.value||126);
  const beatsIn2s = Math.max(1, Math.round(2 / (60000/bpmVal)));
  arr.push({ atMs: rel, type:'strobe', hz:8, duty:0.35, lenBeats: beatsIn2s });
  await setPatterns(arr);
};

document.getElementById('torchOn').onclick  = ()=>{ console.log("[O25] torchOn()");  torchCommand(serverNow(), true); };
document.getElementById('torchOff').onclick = ()=>{ console.log("[O26] torchOff()"); torchCommand(serverNow(), false); };
document.getElementById('screenBlack').onclick = async ()=>{
  console.log("[O27] screenBlack()");
  await setPatterns([]);
};

// Time ticker
setInterval(()=>{
  timeInfo.textContent = `Local: ${new Date().toLocaleTimeString()} | Δserver≈${serverOffset}ms | ServerNow: ${new Date(serverNow()).toISOString()}`;
}, 500);

// Boot
loadShow().then(()=>console.log("[O28] Initial loadShow() done."));
</script>
</body>
</html>
