<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hit Tendency Cards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Arial Narrow',Arial,sans-serif;background:#bbb;font-size:7pt}

#ctrl{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);
  z-index:99;background:#fff;border:1px solid #999;border-radius:5px;
  padding:5px 12px;display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:10pt;white-space:nowrap;
}
#ctrl select{font-size:10pt;padding:2px 5px;border-radius:3px;border:1px solid #bbb}
#ctrl em{font-size:7pt;color:#999;font-style:normal}
@media print{
  #ctrl{display:none}
  body{background:#fff}
  *{color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ct thead th,.spill,.h2,.h3{color:#fff!important}
}

/* Letter landscape sheet */
@page{size:11in 8.5in landscape;margin:0}

.sheet{
  width:11in;height:8.5in;
  background:#fff;
  margin:60px auto 0;
  page-break-after:always;break-after:page;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.4in;
}
@media print{.sheet{margin:0}}

/* THE CARD — exactly 5"×3" index card */
.card{
  width:5in;
  height:3in;
  border:1.5px solid #222;
  border-radius:3px;
  padding:0.1in 0.12in 0.07in;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#fff;
}

.card-hdr{
  display:flex;align-items:baseline;gap:5px;
  border-bottom:1.5px solid #111;padding-bottom:2px;margin-bottom:3px;
  flex-shrink:0;
}
.tname{font-size:7.5pt;font-weight:900;text-transform:uppercase;letter-spacing:1px;flex:1}
.slbl{font-size:6.5pt;font-weight:800;color:#000;letter-spacing:.5px}
.spill{font-size:6.5pt;font-weight:800;color:#fff;padding:0 6px;border-radius:2px}

/* Table fills remaining card height */
.ct{
  width:100%;border-collapse:collapse;flex:1;
  table-layout:fixed;font-size:6pt;
}
.ct colgroup .cn{width:0.92in}
.ct colgroup .ch{width:0.14in}
.ct colgroup .cx{width:0.44in}

.ct thead th{
  background:#2c3e50;color:#d5d8dc;
  text-align:center;padding:1px 0;
  font-size:5.5pt;font-weight:700;
  border:0.5px solid #1a252f;
}
.ct thead th.thn{text-align:left;padding-left:3px;color:#ecf0f1}
.ct thead th.thx{background:#1a252f;color:#f0e68c;font-size:5pt}

.ct tbody td{
  text-align:center;
  border:0.5px solid #ccc;
  font-size:6pt;font-weight:600;
  padding:1px 0;
  vertical-align:middle;
  line-height:1;
}
.ct tbody tr:nth-child(odd) td{background:#f4f6f7}
.ct tbody tr:nth-child(even) td{background:#fff}
.ct tbody td.tn{text-align:left;padding-left:3px;font-weight:700;font-size:6pt;white-space:nowrap;overflow:hidden}
.ct tbody td.th{font-size:5.5pt;font-weight:600;color:#000}
.ct tbody td.tx{font-weight:700;border-color:#aaa}
.ct tbody td.txi{background:#fef9e7!important}
.ct tbody td.txo{background:#eafaf1!important}

.h1{background:#aed6f1!important}
.h2{background:#2980b9!important;color:#fff!important}
.h3{background:#154360!important;color:#fff!important;font-weight:800!important}

.leg{
  flex-shrink:0;margin-top:2px;padding-top:2px;
  border-top:0.5px solid #ddd;
  font-size:4.5pt;color:#000;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.sw{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:1px;vertical-align:middle}
</style>
</head>

const Z=['PL','Pull','PG','Ctr','OG','Oppo','OL'];

function p(n,t){return t?Math.round(100*n/t)+'%':'-'}
function hc(n,t){if(!t)return '';const v=100*n/t;return v>=30?' h3':v>=20?' h2':v>=12?' h1':''}
function ns(s){const a=s.split(',');return a.length===2?a[0].trim()+', '+a[1].trim()[0]+'.':s}

function card(teamName, batters, split, sec){
  const isIF = sec==='if';
  const color = split==='RHP'?'#c0392b':'#1a5276';
  const xCls  = isIF?'txi':'txo';
  const xHdr  = isIF?'AvgEV':'AvgDst';

  const rows = batters.map(b=>{
    const d = b.splits[split][sec];
    const cells = Z.map(z=>`<td class="${hc(d[z],d.n)}">${p(d[z],d.n)}</td>`).join('');
    const xv = isIF?(d.ev!=null?d.ev:'−'):(d.dist!=null?d.dist+"'":'−');
    return `<tr><td class="tn">${ns(b.name)}</td><td class="th">${b.hand}</td>${cells}<td class="tx ${xCls}">${xv}</td></tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-hdr">
      <span class="tname">${teamName}</span>
      <span class="slbl">${isIF?'INFIELD':'OUTFIELD'}</span>
      <span class="spill" style="background:${color}">vs ${split}</span>
    </div>
    <table class="ct">
      <colgroup><col class="cn"><col class="ch">${Z.map(()=>'<col>').join('')}<col class="cx"></colgroup>
      <thead><tr>
        <th class="thn">Batter</th><th></th>
        ${Z.map(z=>`<th>${z}</th>`).join('')}
        <th class="thx">${xHdr}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="leg">
      <span><span class="sw" style="background:#aed6f1"></span>12–19%</span>
      <span><span class="sw" style="background:#2980b9"></span>20–29%</span>
      <span><span class="sw" style="background:#154360"></span>30%+</span>
      <span>· PL=Pull Line · PG=Pull Gap · OG=Oppo Gap · OL=Oppo Line</span>
    </div>
  </div>`;
}

function sheet(teamName, batters, split){
  return `<div class="sheet">
    ${card(teamName,batters,split,'if')}
    ${card(teamName,batters,split,'of')}
  </div>`;
}

const cache={};
function go(code){
  if(!cache[code]){
    const {name,batters}=D[code];
    cache[code]=
      `<div class="sheet">${card(name,batters,'LHP','if')}${card(name,batters,'RHP','of')}</div>`+
      `<div class="sheet">${card(name,batters,'RHP','if')}${card(name,batters,'LHP','of')}</div>`;
  }
  document.getElementById('app').innerHTML=cache[code];
}
go('STA_YAN');
</script>
